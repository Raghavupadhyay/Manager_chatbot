[project]
name = "ops-copilot"
version = "1.0.0"
description = "Operations Copilot — production-grade multi-agent course launch control plane"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "langgraph==0.2.60",
    "langgraph-checkpoint-sqlite==2.0.11",
    "aiosqlite==0.21.0",
    "langchain==0.3.30",
    "langchain-core==0.3.86",
    "langchain-google-genai==2.1.12",
    "langsmith==0.14.17",
    "python-dotenv==1.2.4",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==1.3.0",
    "httpx==0.28.1",
    "ruff==0.14.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ops_copilot"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests", "evals"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
