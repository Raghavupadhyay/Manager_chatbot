services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # Override for the container's internal path; keep DBs on the volume
      DATA_DIR: /app/data
    volumes:
      - app_data:/app/data
    restart: unless-stopped

volumes:
  app_data:
